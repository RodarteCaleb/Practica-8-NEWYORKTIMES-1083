<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Zona Informativa</title>
    <style>
        * { box-sizing:border-box; }
        body { margin:0; font-family:Arial,sans-serif; background:#eceff1; color:#222; }
        .barra { background:#263238; color:white; padding:18px 7%; font-size:24px; font-weight:bold; }
        .barra span { color:#ffca28; }
        .caja { width:360px; max-width:90%; background:white; margin:70px auto; padding:28px; border-radius:10px; box-shadow:0 3px 12px #0002; }
        h1 { text-align:center; font-size:25px; margin-top:0; }
        p { text-align:center; color:#666; font-size:14px; }
        label { display:block; font-weight:bold; font-size:13px; margin:18px 0 6px; }
        input { width:100%; padding:12px; border:1px solid #bbb; border-radius:5px; font-size:14px; }
        button { width:100%; margin-top:20px; padding:12px; border:0; border-radius:5px; background:#ffca28; font-weight:bold; cursor:pointer; }
        .regresar { display:block; text-align:center; margin-top:18px; color:#263238; text-decoration:none; font-size:13px; }
        #mensaje { color:#2e7d32; font-weight:bold; margin-top:15px; }
    </style>
</head>
<body>
    <div class="barra">Zona<span>Informativa</span></div>
    <main class="caja">
        <h1>Iniciar sesion</h1>
        <p>Ingresa tus datos para continuar.</p>
        <form onsubmit="iniciarSesion(event)">
            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" required>
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" required>
            <button type="submit">Entrar</button>
        </form>
        <p id="mensaje"></p>
        <a class="regresar" href="index.html">← Regresar a la pagina principal</a>
    </main>
    <script>
        function iniciarSesion(event) {
            event.preventDefault();
            document.getElementById("mensaje").textContent = "Inicio de sesion realizado correctamente.";
        }
    </script>
</body>
</html>
